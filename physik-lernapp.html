      id: 'sh2c', title: '2c) Parallelschaltung', text: 'C₁ = 4 µF und C₂ = 10 µF parallel an 12 V. Bestimme die Gesamtkapazität und die Gesamtladung.',
      inputs: [{ label: 'C_ges', unit: 'µF', ans: 14 }, { label: 'Q_ges', unit: 'µC', ans: 168 }],
      steps: ['C_ges = C₁ + C₂ = 4 µF + 10 µF = <b>14 µF</b>', 'Q₁ = 4 µF · 12 V = 48 µC, Q₂ = 10 µF · 12 V = 120 µC', 'Q_ges = 48 µC + 120 µC = <b>168 µC</b> (oder C_ges · U = 14 µF · 12 V)'],
      note: 'Vergleich mit deinen Notizen: Bei Q₂ steht in einer Zeile „4 µF · 12 V = 120 µC“. Richtig ist <b>10 µF · 12 V = 120 µC</b>.'
    }
  ];
}

/* ---------- Zufallsaufgaben ---------- */
const GEN = [
  () => {
    const D = pick([6, 8, 10, 12, 15, 20]), d = pick([1, 2, 3, 4, 5]), U = pick([500, 1000, 2000, 3000, 5000]);
    const A = Math.PI * (D / 200) ** 2, C = E0 * A / (d / 1000), E = U / (d / 1000);
    return { title: 'Plattenkondensator', text: `Ein Plattenkondensator hat runde Platten mit Durchmesser ${D} cm und den Abstand ${d} mm. Die Spannung beträgt ${U} V (Luft). Berechne C und E.`, inputs: [{ label: 'C', unit: 'pF', ans: C * 1e12 }, { label: 'E', unit: 'kV/m', ans: E / 1e3 }], steps: [`A = π·(${D / 200} m)² = ${fmt(A, 4)} m²`, `C = ε<sub>0</sub>·A/d = ${fmt(C * 1e12, 4)} pF`, `E = U/d = ${U} V / ${d / 1000} m = ${fmt(E / 1e3, 4)} kV/m`] };
  },
  () => {
    const C = pick([2, 3, 4, 5, 8, 10, 22, 47]), U = pick([5, 6, 9, 12, 24]);
    return { title: 'Ladung auf dem Kondensator', text: `Ein Kondensator mit ${C} µF wird an ${U} V angeschlossen. Wie groß ist die Ladung?`, inputs: [{ label: 'Q', unit: 'µC', ans: C * U }], steps: [`Q = C·U = ${C} µF · ${U} V = <b>${C * U} µC</b>`] };
  },
  () => {
    let a = pick([2, 3, 4, 5, 6, 8, 10, 12, 20]), b = pick([2, 3, 4, 5, 6, 8, 10, 12, 20]); if (a === b) b += 1;
    const U = pick([6, 9, 12, 24]), Cg = a * b / (a + b), Q = Cg * U, U1 = Q / a;
    return { title: 'Reihenschaltung', text: `Zwei Kondensatoren (${a} µF und ${b} µF) liegen in Reihe an ${U} V. Berechne C_ges und die Spannung am ${a}-µF-Kondensator.`, inputs: [{ label: 'C_ges', unit: 'µF', ans: Cg }, { label: 'U₁', unit: 'V', ans: U1 }], steps: [`1/C_ges = 1/${a} + 1/${b} = ${fmt(1 / a + 1 / b, 4)} 1/µF → C_ges = <b>${fmt(Cg, 4)} µF</b>`, `Q = C_ges·U = ${fmt(Q, 4)} µC (auf beiden gleich)`, `U₁ = Q/C₁ = ${fmt(Q, 4)} µC / ${a} µF = <b>${fmt(U1, 4)} V</b>`] };
  },
  () => {
    let a = pick([2, 3, 4, 5, 6, 8, 10, 12, 20]), b = pick([2, 3, 4, 5, 6, 8, 10, 12, 20]);
    const U = pick([6, 9, 12, 24]);
    return { title: 'Parallelschaltung', text: `Zwei Kondensatoren (${a} µF und ${b} µF) liegen parallel an ${U} V. Berechne C_ges und die Gesamtladung.`, inputs: [{ label: 'C_ges', unit: 'µF', ans: a + b }, { label: 'Q_ges', unit: 'µC', ans: (a + b) * U }], steps: [`C_ges = ${a} µF + ${b} µF = <b>${a + b} µF</b>`, `Q_ges = C_ges·U = ${a + b} µF · ${U} V = <b>${(a + b) * U} µC</b>`] };
  },
  () => {
    const R = pick([47, 100, 220, 330, 470, 1000]), C = pick([47, 100, 220, 470, 1000]);
    const tau = R * C * 1e-6;
    return { title: 'RC-Kreis', text: `Ein Kondensator mit ${C} µF wird über einen Widerstand von ${R} Ω entladen. Berechne τ und die Zeit, nach der er technisch entladen ist (5τ).`, inputs: [{ label: 'τ', unit: 'ms', ans: tau * 1e3 }, { label: '5τ', unit: 'ms', ans: 5 * tau * 1e3 }], steps: [`τ = R·C = ${R} Ω · ${C}·10⁻⁶ F = ${fmt(tau, 4)} s = <b>${fmt(tau * 1e3, 4)} ms</b>`, `5τ = <b>${fmt(5 * tau * 1e3, 4)} ms</b>`] };
  },
  () => {
    const U0 = pick([4, 5, 6, 8, 9, 12]);
    return { title: 'Spannung nach τ', text: `Ein Kondensator ist auf ${U0} V geladen und wird entladen. Wie groß ist die Spannung nach genau einer Zeitkonstante τ?`, inputs: [{ label: 'U_C(τ)', unit: 'V', ans: U0 * Math.exp(-1) }], steps: [`U_C(τ) = U₀·e⁻¹ = ${U0} V · 0,368 = <b>${fmt(U0 * Math.exp(-1), 3)} V</b>`] };
  },
  () => {
    const U1 = pick([1000, 2000, 3000]), er = pick([1.25, 1.5, 2, 2.5, 4]);
    return { title: 'Dielektrikum', text: `Ein abgeklemmter Plattenkondensator hat die Spannung ${U1} V. Nach dem Einschieben einer Platte misst man ${fmt(U1 / er)} V. Berechne εr.`, inputs: [{ label: 'εr', unit: '', ans: er }], steps: [`Q bleibt konstant → εr = U₁/U₂ = ${U1} V / ${fmt(U1 / er)} V = <b>${fmt(er)}</b>`] };
  },
  () => {
    const q = pick([2, 4, 5, 10, 20]), U = pick([4, 5, 8, 10, 12]);
    return { title: 'Arbeit im Feld', text: `Eine Ladung von ${q} µC durchläuft eine Spannung von ${U} V. Wie groß ist die Arbeit?`, inputs: [{ label: 'W', unit: 'µJ', ans: q * U }], steps: [`W = q·U = ${q} µC · ${U} V = <b>${q * U} µJ</b> (Fläche des Rechtecks im Arbeitsdiagramm)`] };
  }
];

/* ---------- Aufgaben-Anzeige ---------- */
function renderProblem(parent, p, onSolved) {
  const d = document.createElement('div');
  d.className = 'card prob';
  d.innerHTML = `<b>${p.title}</b><p>${p.text}</p>` + p.inputs.map((x, i) => `<div class="inp"><label>${x.label}</label><input type="text" inputmode="decimal" data-i="${i}" placeholder="?" autocomplete="off"><span class="u">${x.unit}</span></div>`).join('') +
    `<div class="row"><button class="btn primary" data-a="chk">Prüfen</button><button class="btn" data-a="sol">Lösung zeigen</button></div><div class="msg"></div><div class="sol" hidden></div>`;
  let solved = false;
  const msg = d.querySelector('.msg'), sol = d.querySelector('.sol');
  const showSol = () => {
    sol.hidden = false;
    sol.innerHTML = '<b>Lösungsweg</b><ol>' + p.steps.map(s => `<li>${s}</li>`).join('') + '</ol>' + (p.note ? `<div class="tip warn">${p.note}</div>` : '');
  };
  d.querySelector('[data-a=sol]').addEventListener('click', showSol);
  d.querySelector('[data-a=chk]').addEventListener('click', () => {
    let ok = true, empty = false;
    d.querySelectorAll('input').forEach((inp, i) => {
      const v = num(inp.value), a = p.inputs[i].ans;
      inp.classList.remove('ok', 'bad');
      if (isNaN(v)) { empty = true; ok = false; return; }
      const good = Math.abs(v - a) <= Math.max(Math.abs(a) * .02, 1e-9);
      inp.classList.add(good ? 'ok' : 'bad'); if (!good) ok = false;
    });
    if (empty) { msg.innerHTML = 'Bitte alle Felder ausfüllen (Komma oder Punkt ist egal).'; return; }
    if (ok) {
      msg.innerHTML = '<b style="color:var(--ok)">✔ Richtig!</b>'; showSol();
      if (!solved) { solved = true; store.set('solved', store.get('solved', 0) + 1); if (onSolved) onSolved(); }
    } else msg.innerHTML = '<span style="color:var(--bad)">Noch nicht ganz.</span> Prüfe Einheiten und Zehnerpotenzen (µ = 10⁻⁶, p = 10⁻¹², k = 10³). Du darfst auf „Lösung zeigen“ tippen.';
  });
  parent.appendChild(d);
}

function modPractice(root) {
  root.innerHTML = `
  <p class="lead">Rechne selbst. Antworten werden mit 2 % Toleranz geprüft. Gelöst: <b id="cnt">0</b></p>
  <div class="seg" id="tabs">
    <button data-t="sheet" class="on">Dein Blatt</button>
    <button data-t="rand">Zufall</button>
    <button data-t="quiz">Quiz</button>
  </div>
  <div id="pane"></div>`;
  const pane = $('#pane', root);
  const cnt = () => { $('#cnt', root).textContent = store.get('solved', 0); };
  function tab(t) {
    pane.innerHTML = '';
    if (t === 'sheet') {
      pane.innerHTML = '<div class="tip">Elektrostatik, Blatt ES-2. Die Lösungswege zeigen auch, wo in deinen Notizen noch kleine Fehler stecken.</div>';
      sheetProblems().forEach(p => renderProblem(pane, p, cnt));
    } else if (t === 'rand') {
      const wrap = document.createElement('div'); pane.appendChild(wrap);
      const nw = () => { wrap.innerHTML = ''; renderProblem(wrap, pick(GEN)(), cnt); };
      const b = document.createElement('button'); b.className = 'btn primary'; b.style.width = '100%'; b.textContent = '↻ Neue Aufgabe'; b.addEventListener('click', nw);
      pane.appendChild(b); nw();
    } else {
      const all = shuffle(QUIZ);
      const info = document.createElement('p'); info.className = 'lead';
      const upd = () => { info.textContent = `Richtig beantwortet (insgesamt): ${Object.keys(store.get('quizok', {})).length} von ${QUIZ.length}`; };
      pane.appendChild(info); upd();
      quiz(pane, all, upd);
    }
  }
  $('#tabs', root).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $('#tabs', root).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    tab(b.dataset.t);
  });
  cnt(); tab('sheet');
  return { resize() { } };
}

</script>
<script>
'use strict';
/* Modul 7: Formelsammlung mit Erklärungen und Suche */
const FORMULAS = [
  { k: 'feldstärke spannung abstand homogen', name: 'Feldstärke im homogenen Feld', f: 'E = ' + fr('U', 'd'), syms: [['E', 'Feldstärke', 'V/m'], ['U', 'Spannung', 'V'], ['d', 'Abstand der Platten', 'm']], expl: 'Wie stark das elektrische Feld ist: Spannung pro Meter. Je kleiner der Abstand bei gleicher Spannung, desto stärker das Feld.', ex: '2000 V / 0,003 m = 666 667 V/m' },
  { k: 'kapazität ladung spannung', name: 'Kapazität und Ladung', f: 'Q = C · U &nbsp;bzw.&nbsp; C = ' + fr('Q', 'U'), syms: [['Q', 'Ladung', 'C'], ['C', 'Kapazität', 'F = C/V'], ['U', 'Spannung', 'V']], expl: 'Die Kapazität sagt, wie viel Ladung pro Volt gespeichert wird. Im Q-U-Diagramm ist C die Steigung.', ex: '4 µF · 12 V = 48 µC' },
  { k: 'plattenkondensator fläche abstand dielektrikum permittivität', name: 'Kapazität des Plattenkondensators', f: 'C = ε<sub>0</sub> · ε<sub>r</sub> · ' + fr('A', 'd'), syms: [['ε<sub>0</sub>', 'Feldkonstante 8,854·10⁻¹²', 'F/m'], ['ε<sub>r</sub>', 'Material (Luft ≈ 1)', ''], ['A', 'Plattenfläche', 'm²'], ['d', 'Abstand', 'm']], expl: 'Große Fläche und kleiner Abstand machen eine große Kapazität. Ein Dielektrikum (z. B. Glas) vergrößert C um den Faktor εr.', tip: 'Proportionalitäten: C ~ A, C ~ 1/d, C ~ A/d.', ex: 'Ø 12 cm, d = 3 mm → 33,4 pF' },
  { k: 'quelle angeschlossen abgeklemmt konstant', name: 'Angeschlossen oder abgeklemmt?', f: 'U = konst. &nbsp;|&nbsp; Q = konst.', expl: '<b>Angeschlossen</b>: Die Quelle hält U fest, Q ändert sich (Q ~ A, Q ~ 1/d). <b>Abgeklemmt</b>: Die Ladung kann nicht weg, Q bleibt; dann gilt U ~ d und E bleibt konstant. Mit Dielektrikum sinkt U auf U₁/εr.', tip: 'Immer zuerst fragen: Was bleibt konstant, U oder Q?' },
  { k: 'dielektrikum glas relative permittivität abgeklemmt', name: 'εr aus der Spannungsänderung', f: 'ε<sub>r</sub> = ' + fr('U<sub>1</sub>', 'U<sub>2</sub>'), expl: 'Gilt für den abgeklemmten Kondensator (Q konstant): Das Material macht C größer, deshalb sinkt die Spannung.', ex: '2000 V / 1600 V = 1,25' },
  { k: 'reihenschaltung kondensator gesamtkapazität', name: 'Reihenschaltung', f: fr('1', 'C<sub>ges</sub>') + ' = ' + fr('1', 'C₁') + ' + ' + fr('1', 'C₂'), expl: 'Gleiche Ladung auf allen, die Spannung teilt sich: U = U₁ + U₂. C_ges ist kleiner als der kleinste Einzelkondensator.', ex: '4 µF und 10 µF → 2,86 µF' },
  { k: 'parallelschaltung kondensator gesamtkapazität', name: 'Parallelschaltung', f: 'C<sub>ges</sub> = C₁ + C₂', expl: 'Gleiche Spannung an allen, die Ladungen addieren sich.', ex: '4 µF + 10 µF = 14 µF' },
  { k: 'arbeit energie ladung spannung', name: 'Arbeit im elektrischen Feld', f: 'W = q · U', syms: [['W', 'Arbeit/Energie', 'J'], ['q', 'Ladung', 'C'], ['U', 'Spannung', 'V']], expl: 'Im Arbeitsdiagramm (q über U) ist die Arbeit die Fläche unter dem Graphen.', ex: '5 µC · 8 V = 40 µJ' },
  { k: 'steigung kapazität diagramm', name: 'Steigung im Q-U-Diagramm', f: fr('ΔQ', 'ΔU') + ' = tan(α) = C', expl: 'Die Steigung der Ursprungsgeraden ist die Kapazität.' },
  { k: 'energie kondensator', name: 'Energie des Kondensators (Ergänzung)', f: 'W = ½ · C · U² = ½ · Q · U', expl: 'Dreiecksfläche unter der Q-U-Geraden.', ex: '½ · 4 µF · (12 V)² = 288 µJ' },
  { k: 'zeitkonstante tau widerstand rc', name: 'Zeitkonstante', f: 'τ = R · C', syms: [['τ', 'Zeitkonstante', 's'], ['R', 'Widerstand', 'Ω'], ['C', 'Kapazität', 'F']], expl: 'Je größer R und C, desto langsamer wird geladen bzw. entladen.', ex: '100 Ω · 470 µF = 0,047 s' },
  { k: 'entladen exponential rc spannung e-funktion', name: 'Entladen eines Kondensators', f: 'U<sub>C</sub>(t) = U<sub>0</sub> · e<sup>−t/τ</sup>', expl: 'Nach τ noch 36,8 %, nach 5τ noch 0,7 %.', ex: '8 V · e⁻¹ = 2,94 V' },
  { k: 'laden exponential rc spannung e-funktion', name: 'Laden eines Kondensators', f: 'U<sub>C</sub>(t) = U<sub>0</sub> · (1 − e<sup>−t/τ</sup>)', expl: 'Nach τ sind 63,2 % erreicht, nach 5τ praktisch voll.' },
  { k: 'millikan schweben ladung elementarladung', name: 'Millikan: Schwebebedingung', f: 'q · ' + fr('U', 'd') + ' = m · g &nbsp;⇒&nbsp; q = ' + fr('m · g · d', 'U'), expl: 'Elektrische Kraft und Gewichtskraft sind gleich groß, das Tröpfchen schwebt. Alle Ladungen sind ganzzahlige Vielfache der Elementarladung e = 1,602·10⁻¹⁹ C.' },
  { k: 'feldlinien eigenschaften homogen äquipotential', name: 'Regeln für Feldlinien', f: 'E ⊥ Leiteroberfläche', expl: 'Feldlinien beginnen auf +, enden auf −, kreuzen sich nie, enden senkrecht auf Leitern, enger = stärker. Äquipotentialflächen stehen senkrecht zu den Feldlinien.' }
];

function modFormulas(root) {
  root.innerHTML = `<p class="lead">Alle Formeln aus deinen Notizen, jeweils mit Erklärung der Größen. Tippe auf eine Karte zum Aufklappen.</p>
    <input class="srch" id="s" placeholder="Suchen, z. B. Reihe, τ, Arbeit, Feldstärke" type="search"><div id="l"></div>`;
  const list = $('#l', root);
  const show = q => {
    q = (q || '').toLowerCase().trim();
    const r = FORMULAS.filter(f => !q || (f.name + ' ' + f.k + ' ' + plain(f.f)).toLowerCase().includes(q));
    list.innerHTML = r.map(f => fcard(f)).join('') || '<p class="lead">Nichts gefunden.</p>';
  };
  $('#s', root).addEventListener('input', e => show(e.target.value));
  show('');
  return { resize() { } };
}

</script>
<script>
'use strict';
const MODS = [
  { id: 'field', ic: '🧲', title: 'Elektrisches Feld', sub: 'Feldlinien, Äquipotentiallinien, homogenes Feld', mount: modField },
  { id: 'cap', ic: '🔋', title: 'Plattenkondensator', sub: 'C, Q, U, E und Dielektrikum', mount: modCap },
  { id: 'circ', ic: '🔌', title: 'Reihe & Parallel', sub: 'Kondensatoren schalten', mount: modCirc },
  { id: 'work', ic: '📈', title: 'Arbeitsdiagramm', sub: 'W = q·U, Steigung = C', mount: modWork },
  { id: 'rc', ic: '⏱️', title: 'RC-Kreis', sub: 'Laden, Entladen, Zeitkonstante τ', mount: modRC },
  { id: 'mill', ic: '🛢️', title: 'Millikan-Versuch', sub: 'Schwebendes Öltröpfchen, Elementarladung', mount: modMill },
  { id: 'form', ic: '📘', title: 'Formelsammlung', sub: 'Alle Formeln erklärt, mit Suche', mount: modFormulas },
  { id: 'prac', ic: '✏️', title: 'Aufgaben & Quiz', sub: 'Dein Blatt, Zufallsaufgaben, Quiz', mount: modPractice }
];
const app = $('#app'), title = $('#title'), back = $('#back');
let active = null;

function home() {
  title.textContent = 'Physik Lernapp · Elektrostatik';
  back.style.display = 'none';
  const seen = store.get('seen', {});
  const qz = Object.keys(store.get('quizok', {})).length;
  app.innerHTML = `
    <p class="lead">Interaktive Lernhilfe zu deinen Physik-Notizen: Elektrisches Feld, Kondensator, Schaltungen, Arbeitsdiagramm, RC-Kreis und Millikan. Wähle ein Thema.</p>
    <div class="grid">${MODS.map(m => `<button class="mod" data-id="${m.id}"><span class="ic">${m.ic}</span><b>${m.title}</b><small>${m.sub}</small>${seen[m.id] ? '<span class="seen">✔ besucht</span>' : ''}</button>`).join('')}</div>
    <div class="card"><b>Dein Fortschritt</b><div class="chips" style="margin-top:6px"><span class="chip">${Object.keys(seen).length} von ${MODS.length} Themen besucht</span><span class="chip">${store.get('solved', 0)} Aufgaben gelöst</span><span class="chip">${qz} von ${QUIZ.length} Quizfragen richtig</span></div></div>
    <p class="lead" style="font-size:.85rem">Tipp: Beginne mit „Elektrisches Feld“ und gehe in der Reihenfolge weiter, so wie deine Notizen aufgebaut sind.</p>`;
  app.querySelectorAll('.mod').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.id; }));
}
function route() {
  if (active && active.stop) active.stop();
  active = null;
  const id = location.hash.slice(1);
  const m = MODS.find(x => x.id === id);
  window.scrollTo(0, 0);
  if (!m) { home(); return; }
  title.textContent = m.title;
  back.style.display = 'block';
  app.innerHTML = '';
  const d = document.createElement('div');
  app.appendChild(d);
  active = m.mount(d);
  const seen = store.get('seen', {}); seen[m.id] = 1; store.set('seen', seen);
}
back.addEventListener('click', () => { location.hash = ''; });
window.addEventListener('hashchange', route);
let rt = 0;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (active && active.resize) active.resize(); }, 150); });
route();

</script>
